<!-- Contenedor principal del Layout (Ocupa el 100% del alto de la pantalla) -->
<div class="flex h-screen p-4 sm:p-6 gap-6 overflow-hidden" [ngClass]="isSidebarExpanded ? 'flex absolute z-50 h-[calc(100vh-2rem)] sm:h-[calc(100vh-3rem)] md:relative md:h-auto' : 'hidden md:flex'">

  <!-- Menú lateral (Sidebar) Colapsable -->
  <aside
    class="hidden md:flex flex-col bg-white rounded-2xl shadow-xl border border-slate-100 transition-all duration-300 ease-in-out overflow-hidden"
    [ngClass]="isSidebarExpanded ? 'w-72 p-6' : 'w-[88px] p-4 items-center'"
  >

    <!-- Cabecera del Sidebar -->
    <div
      class="flex items-center gap-3 mb-8 w-full transition-all duration-300"
      [ngClass]="isSidebarExpanded ? 'justify-start' : 'justify-center'"
    >
      <!-- Logo (Mantiene siempre su tamaño) -->
      <div class="shrink-0 w-12 h-12 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-sm">
        GE
      </div>
      <!-- Textos del Logo (Se ocultan si está colapsado) -->
      <div
        class="whitespace-nowrap transition-all duration-300"
        [ngClass]="isSidebarExpanded ? 'opacity-100 w-auto' : 'opacity-0 w-0 hidden'"
      >
        <p class="text-xs font-medium text-slate-500">Gestión de Empleados</p>
        <p class="text-base font-extrabold tracking-tight text-slate-900">Espacio de equipo</p>
      </div>
    </div>

    <!-- Navegación -->
    <nav class="flex-1 space-y-2 w-full">
      <!-- Item: Panel de Control (Activo) -->
      <a href="#"
         class="flex items-center gap-3 rounded-lg font-semibold transition-all duration-200 bg-indigo-50 text-indigo-700"
         [ngClass]="isSidebarExpanded ? 'px-4 py-3 justify-start' : 'w-12 h-12 justify-center mx-auto px-0'"
      >
        <svg class="shrink-0 w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
        </svg>
        <span class="whitespace-nowrap transition-all duration-300" [ngClass]="isSidebarExpanded ? 'block' : 'hidden'">
          Panel de Control
        </span>
      </a>

      <!-- Item: Empleados -->
      <a href="#"
         class="flex items-center gap-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-lg font-medium transition-all duration-200"
         [ngClass]="isSidebarExpanded ? 'px-4 py-3 justify-start' : 'w-12 h-12 justify-center mx-auto px-0'"
      >
        <svg class="shrink-0 w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
        <span class="whitespace-nowrap transition-all duration-300" [ngClass]="isSidebarExpanded ? 'block' : 'hidden'">
          Empleados
        </span>
      </a>

      <!-- Item: Proyectos -->
      <a href="#"
         class="flex items-center gap-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-lg font-medium transition-all duration-200"
         [ngClass]="isSidebarExpanded ? 'px-4 py-3 justify-start' : 'w-12 h-12 justify-center mx-auto px-0'"
      >
        <svg class="shrink-0 w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
        </svg>
        <span class="whitespace-nowrap transition-all duration-300" [ngClass]="isSidebarExpanded ? 'block' : 'hidden'">
          Proyectos
        </span>
      </a>
    </nav>

    <!-- Botón de acción (Crear registro) -->
    <div class="pt-6 mt-auto w-full flex flex-col items-center">
      <!-- Título de sección (Solo expandido) -->
      <p
        class="text-xs font-medium text-slate-500 mb-3 px-1 w-full"
        [ngClass]="isSidebarExpanded ? 'block text-left' : 'hidden'"
      >
        Acceso rápido
      </p>

      <button
        class="flex justify-center items-center rounded-lg bg-indigo-600 text-white shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-all duration-200"
        [ngClass]="isSidebarExpanded ? 'w-full px-4 py-3 text-sm font-semibold' : 'w-12 h-12 p-0'"
      >
        <!-- Icono para botón primario (Aparece en ambos estados, pero centrado sin texto si está colapsado) -->
        <svg class="w-5 h-5 shrink-0" [ngClass]="isSidebarExpanded ? 'mr-2' : 'mr-0'" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        <span class="whitespace-nowrap transition-all duration-300" [ngClass]="isSidebarExpanded ? 'block' : 'hidden'">
          Crear registro
        </span>
      </button>
    </div>
  </aside>

  <!-- Área de contenido principal -->
  <div class="flex-1 flex flex-col gap-6 overflow-hidden">

    <!-- Barra superior (Topbar) -->
    <header class="bg-white rounded-2xl shadow-xl border border-slate-100 p-4 flex items-center justify-between">

      <!-- Botón para alternar la visibilidad del Sidebar en móviles -->
      <!-- Botón Topbar -->
      <button
        (click)="toggleSidebar()"
        class="p-2 text-slate-500 hover:bg-slate-50 hover:text-slate-900 rounded-lg transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>

      <!-- Menú de usuario y control de acceso -->
      <div class="flex items-center bg-slate-50 border border-slate-200 rounded-xl p-2 pr-3 shadow-sm">
        <div class="flex items-center gap-3 mr-4 pl-1">
          <div class="w-9 h-9 rounded-full bg-indigo-600 flex items-center justify-center text-white font-bold text-sm shadow-sm">
            JL
          </div>
          <div class="hidden sm:block">
            <p class="text-sm font-bold text-slate-900 leading-tight">{{loggedUserData?.employeeName}}</p>
            <p class="text-xs text-slate-500">{{loggedUserData?.role}}</p>
          </div>
        </div>

        <button (click)="onLogOff()" class="px-4 py-2 bg-white border border-slate-200 text-slate-700 text-sm font-semibold rounded-lg hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-1 transition-all duration-200 shadow-sm">
          Cerrar sesión
        </button>
      </div>

    </header>

    <!-- Contenedor del módulo activo (Router Outlet en Angular) -->
    <main class="flex-1 bg-white rounded-2xl shadow-xl border border-slate-100 p-6 sm:p-8 overflow-y-auto flex">

      <div class="w-full rounded-xl bg-gradient-to-b from-slate-50 to-white border border-slate-100 p-8 flex">
        <router-outlet></router-outlet>
      </div>

    </main>

  </div>
</div>
