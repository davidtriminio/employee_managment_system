<!-- Contenedor principal: Ya no necesita bg-slate-50 ni font-sans porque lo hereda del body -->
<div class="min-h-screen flex items-center justify-center px-4 sm:px-6 lg:px-8">

  <!-- Tarjeta del Login -->
  <div class="max-w-md w-full space-y-8 bg-white p-8 sm:p-10 rounded-2xl shadow-xl border border-slate-100">

    <!-- Encabezado -->
    <div class="text-center">
      <div class="mx-auto h-12 w-12 bg-indigo-100 rounded-xl flex items-center justify-center mb-4">
        <svg class="h-8 w-8 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4" />
        </svg>
      </div>
      <h2 class="text-3xl font-extrabold tracking-tight">Bienvenido de nuevo</h2>
      <p class="mt-2 text-sm text-slate-500">Ingresa tus credenciales para acceder a tu cuenta</p>
    </div>

    <!-- Formulario (Payload: userName, password) -->
    <form class="mt-8 space-y-6" action="#" method="POST">
      <div class="space-y-5">

        <!-- Campo: userName -->
        <div>
          <label for="userName" class="block text-sm font-medium text-slate-700 mb-1">Nombre de usuario</label>
          <div class="relative">
            <input
              id="userName"
              name="userName"
              [(ngModel)]="loginObj.userName"
              type="text"
              required
              class="block w-full appearance-none rounded-lg border border-slate-300 bg-white px-4 py-2.5 placeholder-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 sm:text-sm transition-all duration-200"
              placeholder="ej. juanperez123"
            >
          </div>
        </div>

        <!-- Campo: password -->
        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
          <div class="relative">
            <input
              id="password"
              name="password"
              [(ngModel)]="loginObj.password"
              type="password"
              required
              class="block w-full appearance-none rounded-lg border border-slate-300 bg-white px-4 py-2.5 placeholder-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 sm:text-sm transition-all duration-200"
              placeholder="••••••••"
            >
          </div>
        </div>
      </div>

      <!-- Opciones adicionales -->
      <div class="flex items-center justify-between mt-4">
        <div class="flex items-center">
          <input
            id="remember-me"
            name="remember-me"
            type="checkbox"
            class="h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 transition-colors cursor-pointer"
          >
          <label for="remember-me" class="ml-2 block text-sm text-slate-600 cursor-pointer select-none">
            Recordar mi sesión
          </label>
        </div>

        <div class="text-sm">
          <!-- Ya no necesita clases de color porque hereda el de la etiqueta <a> global -->
          <a href="#" class="font-medium">
            ¿Olvidaste tu contraseña?
          </a>
        </div>
      </div>

      <!-- Botón de Submit -->
      <div>
        <button
          type="button"
          (click)="onLogin()"
          class="group relative flex w-full justify-center items-center rounded-lg border border-transparent bg-indigo-600 px-4 py-3 text-sm font-semibold text-white shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-all duration-200"
        >
          Iniciar sesión
          <svg class="ml-2 h-4 w-4 opacity-0 group-hover:opacity-100 group-hover:translate-x-1 transition-all duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </button>
      </div>
    </form>
  </div>
</div>
